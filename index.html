<!DOCTYPE html>
<html>
<head>
  <title>Family Menu: Meal Suggestions</title>
  <style>
    .tab {
      display: inline-block;
      margin-right: 10px;
      padding: 8px;
      background: #ddd;
      cursor: pointer;
    }
    .tab-content {
      display: none;
      margin-top: 20px;
    }
    .active {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Family Meal Voting</h1>
  <p><strong>Current Date & Time:</strong> <span id="datetime"></span></p>

  <h2>Your Name/Nickname</h2>
  <input type="text" id="name" placeholder="Enter your name"><br><br>

  <!-- Tabs -->
  <div>
    <div class="tab" onclick="showTab('breakfast')">Breakfast</div>
    <div class="tab" onclick="showTab('lunch')">Lunch</div>
    <div class="tab" onclick="showTab('dinner')">Dinner</div>
  </div>

  <!-- Breakfast -->
  <div id="breakfast" class="tab-content">
    <h2>Breakfast Option</h2>
    <label><input type="radio" name="breakfast" value="Yes"> Yes, I want breakfast</label><br>
    <label><input type="radio" name="breakfast" value="No"> No, I’ll skip breakfast</label><br>
  </div>

  <!-- Lunch -->
  <div id="lunch" class="tab-content">
    <h2>Lunch Options</h2>
    <label><input type="radio" name="lunch" value="Meal A"> Meal A</label><br>
    <label><input type="radio" name="lunch" value="Meal B"> Meal B</label><br>
    <label><input type="radio" name="lunch" value="Meal C"> Meal C</label><br>
  </div>

  <!-- Dinner -->
  <div id="dinner" class="tab-content">
    <h2>Dinner Options</h2>
    <label><input type="radio" name="dinner" value="Meal X"> Meal X</label><br>
    <label><input type="radio" name="dinner" value="Meal Y"> Meal Y</label><br>
    <label><input type="radio" name="dinner" value="Meal Z"> Meal Z</label><br>
  </div>

  <!-- Delivery -->
  <h2>Delivery Preference</h2>
  <label><input type="radio" name="delivery" value="Bedroom"> Bedroom</label><br>
  <label><input type="radio" name="delivery" value="Dining Table"> Dining Table</label><br>
  <label><input type="radio" name="delivery" value="Pickup"> Pickup</label><br>
  <label>Custom: <input type="text" name="custom-location" placeholder="Enter location"></label><br>
  <label>Time: <input type="text" name="custom-time" placeholder="Enter time"></label><br>

  <button id="submit-btn">Submit Choices</button>

  <script src="script.js"></script>
</body>
</html>
